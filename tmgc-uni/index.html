    <section class="seo-fallback">
      <h2>Guía Tamagotchi Uni: personajes de los DLC del Tama Portal</h2>
      <p>Para conseguir un personaje de DLC hay que darle su comida o snack, o jugar con su ítem, al menos una vez antes de que el Tamagotchi pase a adulto. Si cumple con varios, sale el del ítem que más veces se usó.</p>
      <h3>Very Berry Land (2024)</h3>
      <p>Hotcaketchi ♂: jugar con Sartén (Frying Pan); Ichigotchi ♀: darle Mochi de frutilla (Strawberry Rice Cake); Ringotchi ♀: darle Pastel de manzana (Apple Cake); Patitchi ♀: darle Pastel pâtissier (Patissier Cake); Cornetchi ♀: darle Sándwich de helado (Ice Cream Sandwich); Tanghulutchi ♀: darle Fruta confitada (Fruit Candy).</p>
      <h3>LoveMelo ♪ Concert (2024)</h3>
      <p>Chekeratchi ♂: jugar con Cabina de DJ (DJ Booth); Drumcrubtchi ♂: darle Palomitas tambor (Drum Popcorn); Lovelitchi ♀: darle Frappé Lovely (Lovely Frappe); Melodytchi ♀: darle Sachertorte ♪ (♪ Sachertorte); Pianitchi ♀: jugar con Piano táctil (Smart Piano Pad); Rhythristchi ♀: darle Fideos rítmicos (Rhythm Noodles).</p>
      <h3>Tamamori Fashion Show ★ (2024)</h3>
      <p>Spacytchi ♂: darle Curry espacial (Spacy Curry); Mystartchi ♂: darle Éclair sombrero de copa (Top Hat Eclair); Boots Brothers ♂: darle Té en vaso bota (Boots-Glass Tea); Moriritchi ♀: darle Fideos Tamamori (Tamamori Noodles); Coffretchi ♀: darle Macaron puff (Puff Macaron); Dresstchi ♀: darle Ensalada vestido (Dress Salad).</p>
      <h3>Sanrio Characters (2024)</h3>
      <p>Mame Kitty ♂: jugar con Caja de moño (Ribbon Box); Patchi Purin ♂: jugar con Bolso Purin (Purin Bag); Usahana Memetchi ♀: darle Sorbete de flor (Flower Sherbet); Cinnamon Moriritchi ♀: jugar con Taza Cinnamon (Cinnamon Cup); Kuromi Melodytchi ♀: jugar con Diario Kuromi (Kuromi Diary); Hangyodon Sebiretchi ♀: darle Pan Hangyodon (Hangyodon Bun); MyMelo Lovelitchi ♀: darle Frutilla Melody (Melody Strawberry); Pochacco Mimitchi ♀: darle Onigiri Pochacco (Pochacco Rice Ball); Cogimyun Woopatchi ♀: darle Algodón Cogimyun (Cotton Cogimyun); Little Unimarutchi ♂♀: darle Panqueque estrella (Star Pancake).</p>
      <h3>Angel Festival (2024)</h3>
      <p>Mame-El ♂: darle Brioche campana (Bell Brioche); Pegasustchi ♂: darle Algodón Pegaso (Pegasus Cotton Candy); Flowerdite ♀: darle Dulces de lluvia (Rain Candy); Sebirecupid ♀: darle Omelette corazón (Heart Omelette); Yumemittie ♀: darle Pan moño (Ribbon Bread); Unimarucorn ♂♀: darle Parfait unicornio (Unicorn Parfait).</p>
      <h3>Monster Carnival (2024)</h3>
      <p>Mamegon ♂: darle Sándwich monstruo (Monster Sandwich); Slimy Patchi ♂: darle Gelatina viscosa (Slimy Jelly); Meduupa ♀: darle Churros serpiente (Snake Churros); Gobpyon ♀: darle Pan goblin (Goblin Bun); Giveuptchi ♀: darle Gelatina de ojos (Eye Ball Jelly); Onimarutchi ♂♀: darle Onigiri ogro (Ogre Rice Ball).</p>
      <h3>Fairy Tale Library (2024)</h3>
      <p>Mamecchio ♂: darle Gelatina ballena (Whale Jelly); Piggypatchis ♂: jugar con Alcancía cerdito (Piggy Bank); Kikigoku ♂: jugar con Nube voladora (Flying Cloud); Pyonderella ♀: darle Flan de calabaza (Pumpkin Pudding); Milkyukihime ♀: darle Manzana caramelizada (Caramelized Apple); Neliakaguya ♀: darle Sushi Kaguya (Kaguya Sushi).</p>
      <h3>PokoPea Land (2024)</h3>
      <p>Peanutskun ♂: darle Gomitas Peanuts-kun (Peanuts-kun Jellies); Chancho ♂: darle Sodas surtidas (Soda Tasters); Peanutsoyaji ♂: jugar con Sauna Peanuts-kun (Peanuts-kun Sauna); Bnn-hairtchi ♂: darle Ramune (Ramune); Tanukininja ♂: darle Poko latte (Poko Latte); Ponpoko ♀: darle Takoyaki infinito (Endless Takoyaki); Gachikoi-P ♀: darle Parfait escarabajo (Beetle Parfait).</p>
      <h3>DoriTama School (2025)</h3>
      <p>Kuromametchi ♂: darle Onigiri fútbol (Soccer Rice Ball); Octpasketchi ♂: darle Galleta básquetbol (Basketball Cookie); Tapepentchi ♂: darle Pastel cinta (Tape Cake); Yumemitchi ♀: darle Bento Yumecantchi (Yumecantchi Bento); Kiraritchi ♀: jugar con Bolso Yume Kira (Yume Kira Bag); Miraitchi ♀: jugar con Knock Tap (Knock Tap); Clulutchi ♀: jugar con Pocket Designer (Pocket Designer).</p>
      <h3>KAWAISOUNI! Land (2025)</h3>
      <p>Opanchu Usagi ♂♀: jugar con Auto personal (Personal Car); Npocham ♂♀: jugar con Macaron (Macaron); Kimimaro ♂♀: darle Galleta (Cookie); Kawaisouni Mametchi ♂: darle Arroz frito (Fried Rice); Kawaisouni Kuchipatchi ♂: darle Flan (Flan); Kawaisouni Mimitchi ♀: darle Yakisoba (Yakisoba).</p>
      <h3>Esther Bunny World (2025)</h3>
      <p>Ribbon Bunny ♂♀: darle Hamburguesa moño (Ribbon Burger); Cream Bunny ♂♀: darle Cupcake de crema (Cream Cupcake); Lavender Bunny ♂♀: darle Macaron lavanda (Lavender Macaron); Happy Bunny ♂♀: jugar con Cámara (Camera); Blue Bunny ♂♀: darle Soda azul (Blue Soda).</p>
      <h3>Tamazon Jungle Tour (2026)</h3>
      <p>Ginjirotchi ♂: darle Arroz recién hecho (Freshly Cooked Rice); Hashizotchi ♂: darle Donas kabuki (Kabuki Donuts); Smartchi ♂: jugar con Piano (Piano); Gorippatchi ♀: darle Montón de plátanos (Banana Hoard); Makiko ♀: jugar con Rizador (Curling Iron); Himespetchi ♀: darle Omelette Mametchi (Mametchi Omelette).</p>
      <h3>Baby&#x27;s Dream (2026)</h3>
      <p>Mameyotchi ♂: darle Potaje Mametchi (Mametchi Pottage); Cakeypatchi ♂: darle Torta mil crepes (Mille Crepe Cake); Shycootchi ♂: darle Dango pesa (Dumbbell Dango); Babumimitchi ♀: darle Repollo relleno (Stuffed Cabbage); Ms. Chama ♀: darle Malatang Chamametchi (Chamametchi Malatang); Unimobiltchi ♂♀: darle Algodón de azúcar Unimaru (Unimaru Cotton Candy).</p>
      <h3>GalGal Street (2026)</h3>
      <p>Mamedecotchi ♂: condición aún desconocida; Gangurpatchi ♂: condición aún desconocida; Bangsinotchi ♀: condición aún desconocida; Galhimetchi ♀: condición aún desconocida; Radmimitchi ♀: condición aún desconocida; Luvlitchi ♀: condición aún desconocida; Cool Melody ♀: condición aún desconocida.</p>
      <h3>Rama base</h3>
      <p>Bebés: Yooyutchi ♂ y Niinitchi ♀ (50%). Niños: Welcotchi ♂ / Lionetchi ♀ con felicidad 10 o más; Mitumarutchi ♂ / Otamatchi ♀ con 9 o menos.</p>
      <p>Adolescentes: Kuriritchi ♂ / Labilatchi ♀ (felicidad 15–20 o 10 manualidades DIY); Gunchitchi ♂ / Teftetchi ♀ (felicidad 6–14 o 40 snacks); Curltchi ♂ / Tustustchi ♀ (felicidad 0–5 o 15 puntajes perfectos).</p>
      <p>Adultos desde Kuriritchi: Mametchi (0 errores), Weeptchi (1–3), Simagurutchi (4+). Desde Gunchitchi: Kuchipatchi (0–1), Shykutchi (2–5), Bigsmile (6+). Desde Curltchi: Kikitchi (0–1), Unimarutchi (2–5), Gozarutchi (6+).</p>
      <p>Adultas desde Labilatchi: Neliatchi (0 errores), Milktchi (1–3), Momotchi (4+). Desde Teftetchi: Woopatchi (0–1), Memetchi (2–5), Picochutchi (6+). Desde Tustustchi: Mimitchi (0–1), Unimarutchi (2–5), Sebiretchi (6+).</p>
      <p>Especiales: Hypertchi y Bubbletchi (generación múltiplo de 5 y matrimonio en el Tamaverse), Simasimatchi y Yattatchi (matrimonio entre dos Uni y un accesorio DIY).</p>
